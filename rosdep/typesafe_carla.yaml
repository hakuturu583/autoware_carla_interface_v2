# rosdep definitions for the keys this repository uses that rosdistro does not
# have yet. Add them to rosdep with:
#
#   echo "yaml https://raw.githubusercontent.com/hakuturu583/autoware_carla_interface_v2/main/rosdep/typesafe_carla.yaml" \
#     | sudo tee /etc/ros/rosdep/sources.list.d/50-typesafe-carla.list
#   rosdep update
python3-typesafe-carla-pip:
  ubuntu:
    pip:
      packages: [typesafe-carla]
