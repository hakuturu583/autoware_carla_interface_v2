# Sensor kit CARLA 1.0 publishes natively on Autoware's topics.
#
# The layout follows the AWSIM sensor kit (awsim_sensor_kit_description), as
# CARLA's own PythonAPI/examples/autoware_demo.py does, so it pairs with
# sensor_model:=awsim_sensor_kit and vehicle_model:=sample_vehicle in Autoware.
# Poses are in the ROS convention (meters, radians); see sensor_kit.py.

vehicle:
  blueprint: vehicle.lincoln.mkz
  # CARLA vehicle origin -> base_link (rear axle projected on the ground),
  # measured for the Lincoln MKZ.
  base_link: {x: -1.39706787}

frames:
  sensor_kit_base_link:
    parent: base_link
    pose: {x: 0.9, z: 2.0, roll: -0.001, pitch: 0.015, yaw: -0.0364}

sensors:
  lidar_top:
    blueprint: sensor.lidar.ray_cast
    parent: sensor_kit_base_link
    pose: {yaw: 1.575}
    frame_id: velodyne_top
    # LiDAR topics are used verbatim (XYZIRCAEDT point cloud).
    topic: /sensing/lidar/top/pointcloud_raw_ex
    attributes:
      channels: 16
      range: 100.0
      upper_fov: 10.0
      lower_fov: -20.0
      points_per_second: 288000
      rotation_frequency: 10.0
      sensor_tick: 0.1
      dropoff_general_rate: 0.0
      dropoff_zero_intensity: 0.0

  traffic_light_camera:
    blueprint: sensor.camera.rgb
    parent: sensor_kit_base_link
    pose: {x: 0.05, y: 0.0175, z: -0.1}
    frame_id: traffic_light_left_camera/camera_optical_link
    # Cameras publish <topic>/image and <topic>/camera_info.
    topic: /sensing/camera/traffic_light
    attributes:
      fov: 90.0
      image_size_x: 1920
      image_size_y: 1080
      sensor_tick: 0.1

  imu:
    blueprint: sensor.other.imu
    parent: sensor_kit_base_link
    pose: {roll: 3.14159265359, yaw: 3.14159265359}
    frame_id: tamagawa/imu_link
    topic: /sensing/imu/tamagawa/imu_raw
    attributes:
      sensor_tick: 0.0333333

  gnss:
    # Publishes the pose in the map (MGRS) frame on <topic>/pose and
    # <topic>/pose_with_covariance. Use sensor.other.gnss for maps without
    # an MGRS offset.
    blueprint: sensor.other.autoware_gnss
    parent: sensor_kit_base_link
    pose: {x: -0.1, z: -0.2}
    frame_id: map
    topic: /sensing/gnss
    attributes:
      sensor_tick: 0.0
